<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow | Employee</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

<div class="app-layout">

    <aside class="sidebar">

        <div class="sidebar-brand">
            <div class="small-logo">D</div>

            <div>
                <h2>Dayflow</h2>
                <span>Employee Portal</span>
            </div>
        </div>

        <nav class="sidebar-nav">

            <button onclick="showEmployeeSection('overview')" class="nav-item active">
                <span>⌂</span>
                Overview
            </button>

            <button onclick="showEmployeeSection('profile')" class="nav-item">
                <span>👤</span>
                My Profile
            </button>

            <button onclick="showEmployeeSection('attendance')" class="nav-item">
                <span>🕘</span>
                Attendance
            </button>

            <button onclick="showEmployeeSection('leave')" class="nav-item">
                <span>📅</span>
                Leave Requests
            </button>

            <button onclick="showEmployeeSection('salary')" class="nav-item">
                <span>💰</span>
                Salary
            </button>

        </nav>

        <div class="sidebar-bottom">

            <div class="mini-user">
                <div class="avatar">R</div>

                <div>
                    <strong>Rahul Sharma</strong>
                    <span>Software Developer</span>
                </div>
            </div>

            <button onclick="logout()" class="logout-side">
                ↪ Logout
            </button>

        </div>

    </aside>


    <main class="main-content">

        <div id="employeeContent"></div>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
