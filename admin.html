<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dayflow | HR Admin</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

<div class="app-layout">

    <aside class="sidebar">

        <div class="sidebar-brand">

            <div class="small-logo">D</div>

            <div>
                <h2>Dayflow</h2>
                <span>HR / Admin</span>
            </div>

        </div>


        <nav class="sidebar-nav">

            <button onclick="showAdminSection('overview')" class="nav-item active">
                <span>⌂</span>
                Overview
            </button>

            <button onclick="showAdminSection('employees')" class="nav-item">
                <span>👥</span>
                Employees
            </button>

            <button onclick="showAdminSection('attendance')" class="nav-item">
                <span>🕘</span>
                Attendance
            </button>

            <button onclick="showAdminSection('leave')" class="nav-item">
                <span>📅</span>
                Leave Requests
            </button>

            <button onclick="showAdminSection('payroll')" class="nav-item">
                <span>💰</span>
                Payroll
            </button>

        </nav>


        <div class="sidebar-bottom">

            <div class="mini-user">

                <div class="avatar admin-avatar">A</div>

                <div>
                    <strong>HR Admin</strong>
                    <span>Human Resources</span>
                </div>

            </div>

            <button onclick="logout()" class="logout-side">
                ↪ Logout
            </button>

        </div>

    </aside>


    <main class="main-content">

        <div id="adminContent"></div>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
